name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The runner is several times slower than a dev Mac: test/tidy.test.ts takes 2-5 s per test there,
      # and one passed vitest's 5 s default.
      - run: npm test -- --testTimeout=30000

  desktop:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri
      - run: npm ci
      # The app embeds dist/ when it compiles (tauri::generate_context!).
      - run: npx vite build
      - run: cargo test --locked
        working-directory: src-tauri
